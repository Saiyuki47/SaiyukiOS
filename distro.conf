# =====================================================================
#  Zentrale Einstellungen deiner Distribution
#  Alles, was du hier änderst, wird beim nächsten ./build.sh übernommen.
# =====================================================================

# --- Identität --------------------------------------------------------
DISTRO_NAME="SaiyukiOS"          # Anzeigename (Bootmenü, Installer, os-release)
DISTRO_ID="saiyukios"            # nur Kleinbuchstaben/Ziffern, kein Leerzeichen
DISTRO_VERSION="1.0"
DISTRO_CODENAME="sprout"         # eigener Codename deiner Version
DISTRO_TAGLINE="Einfach. Schnell. Meins."
DISTRO_URL="https://github.com/Saiyuki47"           # Projekt-Webseite (für os-release/Installer)
DISTRO_SUPPORT_URL="https://github.com/Saiyuki47"
DISTRO_PUBLISHER="Saiyuki47"

# Farben für Logo, Hintergrundbild, Bootmenü und KDE-Akzentfarbe (Hex)
COLOR_PRIMARY="#2E9E68"
COLOR_ACCENT="#6CCF98"
COLOR_DARK="#0C2219"

# --- Basis --------------------------------------------------------------
DEBIAN_SUITE="trixie"            # Debian 13 (stable). "forky" = testing
ARCH="amd64"

# --- Sprache & Region (Live-System und Installer-Voreinstellung) ------
LOCALE="de_DE.UTF-8"
KEYBOARD="de"
TIMEZONE="Europe/Berlin"

# --- Live-System --------------------------------------------------------
LIVE_HOSTNAME="${DISTRO_ID}"
LIVE_USERNAME="live"             # Passwort im Live-System: "live"

# --- Paketquellen -------------------------------------------------------
# Während des Builds verwendet (http genügt, apt prüft die Signaturen).
BUILD_MIRROR="${BUILD_MIRROR:-http://deb.debian.org/debian/}"
BUILD_MIRROR_SECURITY="${BUILD_MIRROR_SECURITY:-http://security.debian.org/debian-security/}"
# Landen später in /etc/apt/sources.list des fertigen Systems.
FINAL_MIRROR="${FINAL_MIRROR:-https://deb.debian.org/debian/}"
FINAL_MIRROR_SECURITY="${FINAL_MIRROR_SECURITY:-https://security.debian.org/debian-security/}"
# Optional: lokaler Paket-Cache, z. B. apt-cacher-ng → "http://127.0.0.1:3142"
APT_HTTP_PROXY="${APT_HTTP_PROXY:-}"

# --- NVIDIA -------------------------------------------------------------
# Aktueller Treiber direkt aus NVIDIAs offizieller Debian-13-Paketquelle
# (RTX 20 / GTX 16 bis RTX 50). Die Reihe 595 ist dort die am längsten
# gepflegte; 610/615 sind neuer. GTX 750 bis 1080 unterstützt NVIDIA ab 590
# nicht mehr – dafür nimmt der Installer automatisch Debians Treiber 550.
NVIDIA_SUPPORT="yes"             # "no" = ohne NVIDIA-Treiber bauen
NVIDIA_BRANCH="595"
NVIDIA_REPO="https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/"
