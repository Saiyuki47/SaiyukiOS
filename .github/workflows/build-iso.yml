name: ISO bauen

on:
  workflow_dispatch:        # manuell über den Reiter "Actions" starten
  push:
    tags: ['v*']            # oder automatisch bei einem Versions-Tag, z. B. v1.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Speicherplatz freimachen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: ISO bauen
        run: ./build-in-docker.sh

      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            *.iso
            *.iso.sha256
          compression-level: 0
          retention-days: 14
